<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nineofive</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #101010;
    color: #f2efe9;
    font-family: 'DM Sans', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .wordmark {
    font-family: 'Lora', serif;
    font-size: clamp(40px, 9vw, 72px);
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .wordmark span { color: #c96f4a; }
  .sub {
    margin-top: 18px;
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #8d887f;
  }
</style>
<script>
  // Eldre e-postlenker (innlogging/passord) peker til roten — send dem videre
  // til kokeboka med nøkkelen intakt, så gamle lenker fortsatt virker.
  (function () {
    var h = location.hash || '';
    if (/access_token|type=recovery|type=signup|type=magiclink/.test(h)) {
      location.replace('/kokebok/' + h);
    }
  })();
</script>
</head>
<body>
<main>
  <div class="wordmark">nine<span>of</span>ive</div>
  <div class="sub">Ny nettside kommer</div>
</main>
</body>
</html>
