[build]
  functions = "netlify/functions"

# Midlertidig: hindre Google-indeksering mens ny nettside bygges.
# FJERN denne blokken når den nye nettsiden er klar (men behold noindex for oppskriftssidene).
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Privat inngang til Castport Studio. Selve innloggingen håndteres av den
# beskyttede Castport-tjenesten; ingen søkerdata lagres på Nineofive-siden.
[[redirects]]
  from = "/castport"
  to = "/castport/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/castport/"
  to = "/castport/index.html"
  status = 200
  force = true

# Offentlig, ulistet søkerlenke. Rekkefølgen er viktig: disse proxyreglene
# må ligge før SPA-fallbackene nedenfor.
[[redirects]]
  from = "/sok/a7k2m9"
  # Last appskallet fra roten. Den synlige Nineofive-stien beholdes i
  # nettleseren, og Castport velger riktig søknadsvisning fra den stien.
  to = "https://casting-studio-no.andersen.chatgpt.site/"
  status = 200
  force = true

[[redirects]]
  from = "/sok/a7k2m9/"
  to = "https://casting-studio-no.andersen.chatgpt.site/"
  status = 200
  force = true

[[redirects]]
  from = "/assets/*"
  to = "https://casting-studio-no.andersen.chatgpt.site/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://casting-studio-no.andersen.chatgpt.site/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/cdn-cgi/*"
  to = "https://casting-studio-no.andersen.chatgpt.site/cdn-cgi/:splat"
  status = 200
  force = true

# Kokeboka bor på /kokebok — SPA-fallback for alle stier under den.
[[redirects]]
  from = "/kokebok/*"
  to = "/kokebok/index.html"
  status = 200

# Alt annet lander på bedriftssiden på roten.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
