[build]
  # VIKTIG: serverfunksjonene i denne mappa driver hele Instagram/TikTok-importen
  # (fetch-url, apify-status, claude, gemini-video, transcribe, fetch-image,
  # search-image). Deploy ALLTID fra full GitHub-bygging — en manuell/delvis
  # netlify-deploy uten denne mappa gjør at importen svarer 404 og dør.
  functions = "netlify/functions"

# Midlertidig: hindre Google-indeksering mens ny nettside bygges.
# FJERN denne blokken når den nye nettsiden er klar (men behold noindex for oppskriftssidene).
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ─── Castport (selvdriftet på Cloudflare siden 1. september 2026) ─────────────
# All Castport-trafikk proxyes til Cloudflare-workeren. status = 200 er usynlig
# videresending: adressen i nettleseren forblir nineofive.no.
# force = true er nødvendig fordi mappa castport/ i dette repoet ellers ville
# skygget regelen og servert den gamle, statiske innloggingssiden.
# Rekkefølgen er viktig: disse reglene må ligge før fallbackene nederst.
[[redirects]]
  from = "/castport"
  to = "https://castport.anders-9c2.workers.dev/castport"
  status = 200
  force = true

[[redirects]]
  from = "/castport/*"
  to = "https://castport.anders-9c2.workers.dev/castport/:splat"
  status = 200
  force = true

# Offentlige, ulistede lenker: søkerskjema, statistskjema, self-tape,
# regi-/kunde-/statistlenker. /sok/* dekker alle tokens, også nye, så det
# trengs ingen ny regel per utlysning.
[[redirects]]
  from = "/sok/*"
  to = "https://castport.anders-9c2.workers.dev/sok/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/assets/*"
  to = "https://castport.anders-9c2.workers.dev/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://castport.anders-9c2.workers.dev/api/:splat"
  status = 200
  force = true


# ─── Interne filer skal ikke serveres ─────────────────────────────────────────
# Netlify publiserer repo-roten, så ALT som ligger i repoet er ellers lesbart
# på nineofive.no. 13. oktober 2026 var både HANDOVER.md, audits/ og
# netlify/lib/auth.js åpent tilgjengelige. force = true er nødvendig, ellers
# vinner en fil som faktisk finnes over regelen.
# Dette treffer ikke serverfunksjonene: de kalles på /.netlify/functions/*,
# med punktum, og den stien matcher ikke /netlify/*.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/db/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/audits/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/Oppskrifter-eldre/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/_innboks/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/output/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/HANDOVER.md"
  to = "/index.html"
  status = 404
  force = true

# Kokeboka bor på /kokebok — SPA-fallback for alle stier under den.
[[redirects]]
  from = "/kokebok/*"
  to = "/kokebok/index.html"
  status = 200

# Alt annet lander på bedriftssiden på roten.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
