<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <title>Castport Studio – Logg inn</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: #382537;
        background: #eeeaf6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 18% 14%, #f3c678 0 8%, transparent 28%),
          #eeeaf6;
      }

      main {
        width: min(100%, 440px);
        padding: 46px 42px 40px;
        border: 1px solid rgba(56, 37, 55, 0.12);
        border-radius: 20px;
        background: #fffaf2;
        box-shadow: 0 24px 70px rgba(56, 37, 55, 0.12);
      }

      .mark {
        display: grid;
        width: 52px;
        height: 52px;
        place-items: center;
        margin-bottom: 32px;
        border-radius: 15px;
        color: #fffaf2;
        background: #d7553f;
        font-family: Georgia, serif;
        font-size: 30px;
        font-weight: 700;
      }

      small {
        color: #9a573b;
        font-size: 12px;
        font-weight: 750;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 10px 0 12px;
        font-family: Georgia, serif;
        font-size: clamp(36px, 9vw, 48px);
        line-height: 1;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0 0 30px;
        color: #716470;
        font-size: 17px;
        line-height: 1.55;
      }

      a {
        display: flex;
        min-height: 52px;
        align-items: center;
        justify-content: center;
        border-radius: 11px;
        color: #fff;
        background: #d7553f;
        font-size: 16px;
        font-weight: 750;
        text-decoration: none;
        transition: transform 150ms ease, background 150ms ease;
      }

      a:hover {
        transform: translateY(-1px);
        background: #c94834;
      }

      footer {
        margin-top: 20px;
        color: #8c7d8a;
        font-size: 13px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">c.</div>
      <small>Privat arbeidsområde</small>
      <h1>Castport Studio</h1>
      <p>Logg inn for å administrere prosjekter, søkere og castingprosessen.</p>
      <a
        href="https://casting-studio-no.andersen.chatgpt.site/signin-with-chatgpt?return_to=/"
      >
        Logg inn i Castport Studio
      </a>
      <footer>Bare inviterte brukere har tilgang.</footer>
    </main>
  </body>
</html>
